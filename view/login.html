<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Font Libre bodoni -->
    <link
      href="https://fonts.googleapis.com/css2?family=Abhaya+Libre:wght@400;500;600;700;800&family=Bubblegum+Sans&family=Buenard:wght@400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Libre+Bodoni:ital,wght@0,400..700;1,400..700&family=Orbitron:wght@400..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <!-- Font Open Sans -->
    <link
      href="https://fonts.googleapis.com/css2?family=Abhaya+Libre:wght@400;500;600;700;800&family=Bubblegum+Sans&family=Buenard:wght@400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Libre+Bodoni:ital,wght@0,400..700;1,400..700&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Orbitron:wght@400..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link href="../dist/output.css" rel="stylesheet" />
    <!-- font awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <style>
    html {
      scroll-behavior: smooth;
    }
    #Logo {
      font-family: "Libre Bodoni", serif;
    }
    a {
      font-family: "Open Sans", sans-serif;
    }
    p {
      font-family: "Open Sans", sans-serif;
    }
    #blog {
      scroll-margin-top: -50px;
    }
    #tentang-kami {
      scroll-margin-top: 115px;
    }
  </style>
  <body class="bg-white">
    <div class="min-h-screen grid grid-cols-2">
      <!-- kkiri -->
      <div class="hidden md:block">
        <img
          src="../assets/Footer-bg.jpg"
          alt="Fashion"
          class="w-full h-full object-cover"
        />
      </div>

      <!-- kanann -->
      <div class="flex items-center justify-center px-10">
        <div class="w-full max-w-md">
          <!-- Logo -->
          <a
            href="../index.html"
            id="Logo"
            class="text-8xl text-center m-15 tracking-[20px]"
          >
            NOIR
          </a>

          <!-- Email -->
          <div class="mb-6 mt-5">
            <input
              id="email"
              type="email"
              placeholder="Email"
              class="w-full border border-gray-500 rounded-2xl px-6 py-4 text-lg outline-none focus:ring-1 focus:ring-black inset-shadow-sm"
            />
          </div>

          <!-- Password -->
          <div class="mb-3 relative">
            <input
              id="password"
              type="password"
              placeholder="Password"
              class="w-full border border-gray-500 rounded-2xl px-6 py-4 text-lg outline-none focus:ring-1 focus:ring-black inset-shadow-sm"
            />

            <button class="absolute right-5 top-1/2 -translate-y-1/2">
              <i class="fa-solid fa-eye-slash text-gray-600"></i>
            </button>
          </div>

          <!-- Remember & Forgot -->
          <div class="flex justify-between items-center text-sm mb-12">
            <label class="flex items-center gap-2">
              <span>Remember me</span>
              <input type="checkbox" />
            </label>

            <a href="#" class="hover:underline"> Lupa password? </a>
          </div>

          <!-- Sign In -->
          <button onclick="login()"
            class="w-full border border-gray-500 rounded-2xl py-3 text-lg font-medium shadow-md hover:bg-gray-800 hover:text-white transition-colors duration-300">
            Sign in
          </button>

          <!-- Divider -->
          <div class="flex items-center gap-4 my-12">
            <div class="flex-1 h-px bg-gray-400"></div>
            <span class="text-xl">Atau</span>
            <div class="flex-1 h-px bg-gray-400"></div>
          </div>

          <div class="grid grid-cols-2 gap-8 mb-10">
            <button
              class="flex items-center justify-center gap-3 border border-gray-500 rounded-2xl py-3 shadow-md hover:bg-gray-800 hover:text-white transition-colors duration-300"
            >
              <img
                src="https://cdn-icons-png.flaticon.com/512/733/733547.png"
                alt="Facebook"
                class="w-7 h-7"
              />
              <span class="text-lg">Facebook</span>
            </button>

            <button
              class="flex items-center justify-center gap-3 border border-gray-500 rounded-2xl py-3 shadow-md hover:bg-gray-800 hover:text-white transition-colors duration-300"
            >
              <img
                src="https://cdn-icons-png.flaticon.com/512/300/300221.png"
                alt="Google"
                class="w-7 h-7"
              />
              <span class="text-lg">Google</span>
            </button>
          </div>

          <!-- Sign Up -->
          <p class="text-center">
            Belum punya Akun?
            <a
              href="./register.html"
              class="font-semibold hover:underline mb-10"
            >
              Sign up
            </a>
          </p>
        </div>
      </div>
    </div>
  </body>

  <script src="../script/auth.js"></script>
</html>
