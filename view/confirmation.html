<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Konfirmasi Pesanan</title>
    <link href="../dist/output.css" rel="stylesheet" />
  </head>
  <body class="bg-gray-100">
    <div class="max-w-3xl mx-auto py-12 px-6">
      <div id="confirmation" class="bg-white p-6 rounded-2xl shadow"></div>
    </div>

    <script>
      function getQueryParam(name) {
        const params = new URLSearchParams(window.location.search);
        return params.get(name);
      }

      const orderId = getQueryParam("orderId");
      const orders = JSON.parse(sessionStorage.getItem("orders") || "[]");
      const order = orders.find((o) => String(o.id) === String(orderId));

      const container = document.getElementById("confirmation");
      if (!order) {
        container.innerHTML =
          '<h2 class="text-xl font-bold">Pesanan tidak ditemukan</h2><p class="mt-3">Pastikan Anda membuat pesanan terlebih dahulu.</p><a href="../view/cart.html" class="text-blue-600 underline mt-4 inline-block">Kembali ke keranjang</a>';
      } else {
        let itemsHtml = "";
        (order.items || []).forEach((it) => {
          itemsHtml += `<div class="flex justify-between py-2 border-b"><div><div class="font-medium">${it.nama_barang}</div><div class="text-sm text-gray-600">x ${it.quantity || 1}</div></div><div class="font-semibold">${new Intl.NumberFormat("id-ID", { style: "currency", currency: "IDR", maximumFractionDigits: 0 }).format((it.harga_barang || 0) * (it.quantity || 1))}</div></div>`;
        });

        container.innerHTML = `
          <h2 class="text-2xl font-bold mb-2">Terima kasih! Pesanan Anda diterima.</h2>
          <p class="text-sm text-gray-600 mb-4">ID Pesanan: <strong>${order.id}</strong></p>
          <div class="mb-4">Nama: <strong>${order.customer?.name || "-"}</strong><br/>Email: <strong>${order.customer?.email || "-"}</strong></div>
          <div class="bg-gray-50 rounded p-4 mb-4">
            ${itemsHtml}
            <div class="flex justify-between font-semibold text-lg mt-3">Total:<span>${new Intl.NumberFormat("id-ID", { style: "currency", currency: "IDR", maximumFractionDigits: 0 }).format(order.total)}</span></div>
          </div>
          <a href="../Homepage.html" class="rounded-xl bg-black px-6 py-3 text-white inline-block hover:bg-zinc-800 transition-colors duration-300">Kembali ke Beranda</a>
          <a href="../view/product.html" class="ml-3 text-gray-700 hover:underline">Lanjutkan Belanja</a>
        `;
      }
    </script>
  </body>
</html>
